name: Bug report
description: Report a Linux rendering, input, window or packaging problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先阅读 `docs/troubleshooting.md`。
        **不要粘贴账号、Cookie、token、完整 URL 查询参数或未脱敏日志。**
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 标签，或自编译 commit
      placeholder: v1.0.1-linux.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - GitHub Release tar.gz
        - 自编译
        - 其他（请在描述中说明）
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统环境
      description: 发行版与版本、桌面环境、X11/Wayland、显示器数量与缩放
      placeholder: Arch Linux, KDE Plasma 6 Wayland, 2 个显示器, 100% + 150%
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU / 驱动
      placeholder: AMD Radeon 780M, Mesa 25.x / NVIDIA 570, proprietary
  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      multiple: true
      options:
        - 主窗口空白/透明
        - 键鼠计数或 input 组
        - 面板/登录/关于窗口
        - 联机 WebSocket
        - 多显示器/窗口位置
        - 启动脚本/桌面菜单/打包
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行 ./run.sh
        2. 点击设置
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志片段（已脱敏）
      description: 来自 ~/.local/share/dev.w33d.wuwatappo.cn.linux/logs/app.log
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已确认日志中不含账号、Cookie、token 等敏感信息
          required: true
        - label: 我使用的是 run.sh 启动，而不是直接运行二进制
          required: true
