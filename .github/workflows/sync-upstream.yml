name: Sync official CN release

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-official-cn
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full

      - run: npm ci

      - name: Check official CN version
        id: upstream
        run: |
          mkdir -p .work
          node scripts/sync-upstream.mjs --check > .work/upstream-check.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync, existsSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const result = JSON.parse(readFileSync('.work/upstream-check.json', 'utf8'));
          if (typeof result.changed !== 'boolean' || !/^\d+\.\d+\.\d+$/.test(result.latestVersion)) throw new Error('Invalid official version response');
          const title = `chore: sync official CN resources ${result.latestVersion}`;
          const open = JSON.parse(execFileSync('gh', ['pr', 'list', '--state', 'open', '--search', `${title} in:title`, '--json', 'title'], { encoding: 'utf8' }));
          const pending = open.some(pr => pr.title === title);
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${result.changed && !pending}\nversion=${result.latestVersion}\n`);
          NODE

      - name: Update lock, extract and validate
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node scripts/sync-upstream.mjs --update-lock
          npm run prepare:frontend
          node scripts/inventory-contract.mjs frontend/assets tests/contracts.json
          npm test

      - name: Open update pull request
        if: steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- upstream-cn.json tests/contracts.json; then exit 0; fi
          BRANCH="chore/official-cn-${VERSION}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream-cn.json tests/contracts.json
          git commit -m "chore: sync official CN resources ${VERSION}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: sync official CN resources ${VERSION}" \
            --body "已更新官方资源锁并重新生成前端契约。此工作流已通过资源完整性校验、提取、前端补丁和 Node 测试。

          合并前请检查新增/删除的 Tauri 命令是否需要 Rust 后端实现，并在本地完成一次登录与联机验证。官方 1.0.1 引入的 \`set_main_skip_taskbar\` 与 \`exit_maintenance_app\` 即由此流程发现。"

      - name: Report incompatible upstream
        if: failure()
        run: |
          set -euo pipefail
          TITLE='Official CN sync needs attention'
          BODY="官方同步或兼容性验证失败，未打开新 PR。请查看运行日志：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
